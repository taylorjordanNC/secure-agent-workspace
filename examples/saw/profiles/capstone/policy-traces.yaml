# OpenShell SandboxPolicy for the `traces` agent — deny-by-default.
# The traces specialist (hermes) may reach ONLY the RHOAI MLflow tracking
# server for OTLP trace ingest and trace queries; everything else is denied.
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  in-cluster-registry:
    name: in-cluster-registry
    endpoints:
      - host: registry.openshell.svc.cluster.local
        port: 4873
        access: read-write
        protocol: rest
        allow_encoded_slash: true
    binaries:
      - path: /usr/bin/npm
      - path: /usr/local/bin/npm
      - path: /usr/bin/node
      - path: /usr/local/bin/node

  tool-egress:
    name: tool-egress
    endpoints:
      - host: telemetry-proxy.openshell-agents.svc.cluster.local
        port: 8081
        access: read-write
        protocol: rest
    binaries:
      - path: /usr/bin/node
      - path: /usr/local/bin/node
      - path: /usr/bin/curl
