apiVersion: saw.redhat.com/v1alpha1
kind: Sandboxes
metadata: {}
spec:
  sandboxes:
    - name: cuda-sandbox
      type: nemoclaw
      enabled: true
      agent: openclaw
      # A single amd64 docker-v2 manifest (no multi-arch index exists on quay).
      image: quay.io/rh-ai-quickstart/nemoclaw-sandbox@sha256:c207a71842d15bac4811c9b652d63e89d29eb90c8e6f9339367f7052425112c6
      providers:
        - nvidia
      # The NemoClaw sandbox runs the OpenClaw gateway too: its control UI
      # gets its own route like the notebook's (see default/sandbox.yaml).
      ui:
        route: true
    - name: toolbox
      type: generic
      # Disabled: collides with default/toolbox (same unit-name scheme).
      enabled: false
      image: base
      providers:
        - nvidia
