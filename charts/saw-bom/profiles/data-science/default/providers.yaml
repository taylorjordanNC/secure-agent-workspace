apiVersion: saw.redhat.com/v1alpha1
kind: Providers
metadata:
  profile: data-science
spec:
  providers:
    - name: nvidia
      type: nvidia
      nemoclawProvider: build
      # glm-53-flash via the RHOAI MaaS endpoint (OpenAI-compatible). The
      # endpoint re-points the provider from the type's hardcoded
      # build.nvidia.com default; the api_key comes from the `inference`
      # pattern secret (values-secret.yaml).
      model: publishers/prelude-maas/models/glm-53-flash
      endpoint: https://maas.apps.ocp.cloud.rhai-tmm.dev/v1
      credentialSecret: inference
      credentialSecretKey: api_key
    - name: brave
      type: brave
      enabled: false
      credentialSecret: web-search
      credentialSecretKey: api_key
