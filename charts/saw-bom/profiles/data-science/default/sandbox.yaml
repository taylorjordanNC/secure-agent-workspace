apiVersion: saw.redhat.com/v1alpha1
kind: Sandboxes
metadata: {}
spec:
  sandboxes:
    - name: notebook
      type: openclaw
      enabled: true
      image: quay.io/rh-ai-quickstart/openclaw-openshell:latest
      providers:
        - nvidia
    - name: cuda-sandbox
      type: nemoclaw
      # Disabled: the new installer's keepalive unit is named
      # openshell-sandbox-<name>.service (no workspace scope), which would
      # collide with cuda-dev's enabled cuda-sandbox.
      enabled: false
      agent: openclaw
      image: quay.io/rh-ai-quickstart/nemoclaw-sandbox:latest
      providers:
        - nvidia
    - name: toolbox
      type: generic
      # Disabled: collides with cuda-dev/toolbox (same unit-name scheme).
      enabled: false
      image: base
      providers:
        - nvidia
