# OpenShell SandboxPolicy for the `metrics` agent — deny-by-default.
# The metrics specialist may reach ONLY the Thanos querier (Prometheus API)
# with node/curl; everything else is denied. Mirrors the launchable
# fleet-roles pattern (policy reviewed in git, applied at sandbox create).
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  in-cluster-registry:
    name: in-cluster-registry
    endpoints:
      - host: registry.openshell.svc.cluster.local
        port: 4873
        access: read-write
        protocol: rest
        allow_encoded_slash: true
    binaries:
      - path: /usr/bin/npm
      - path: /usr/local/bin/npm
      - path: /usr/bin/node
      - path: /usr/local/bin/node

  tool-egress:
    name: tool-egress
    endpoints:
      - host: thanos-querier.openshift-monitoring.svc.cluster.local
        port: 9091
        access: read-write
        protocol: rest
    binaries:
      - path: /usr/bin/node
      - path: /usr/local/bin/node
      - path: /usr/bin/curl
