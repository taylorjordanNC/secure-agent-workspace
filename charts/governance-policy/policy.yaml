version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# The interceptor's policy manifest is the ceiling for what sandbox policies
# may declare: the interceptor only signs network access it governs. These
# endpoints are the platform-vended observability egress for the SRE copilot
# capstone fleet — per-agent sandbox policies pick subsets of these (the
# `metrics` agent gets only the Thanos querier, `traces` only the MLflow
# server, `analyst` none), and the deny-by-default posture is preserved.
network_policies:
  in-cluster-registry:
    name: in-cluster-registry
    endpoints:
      - host: registry.openshell.svc.cluster.local
        port: 4873
        access: read-write
        protocol: rest
        allow_encoded_slash: true
    binaries:
      - path: /usr/bin/npm
      - path: /usr/local/bin/npm
      - path: /usr/bin/node
      - path: /usr/local/bin/node

  observability-egress:
    name: observability-egress
    endpoints:
      - host: telemetry-proxy.openshell-agents.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: telemetry-proxy.openshell-agents.svc.cluster.local
        port: 8081
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/node
      - path: /usr/local/bin/node
