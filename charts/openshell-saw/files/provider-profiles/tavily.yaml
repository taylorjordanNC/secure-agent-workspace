id: tavily
display_name: Tavily Search
description: Tavily Search API access for governed sandbox agents
category: other
credentials:
  - name: api_key
    description: Tavily Search API key
    env_vars: [TAVILY_API_KEY]
    required: true
    auth_style: header
    header_name: Authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.tavily.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-only
binaries:
  - /usr/bin/curl
  - /usr/local/bin/curl
  # OpenClaw's node: /usr/bin/node-<major> in the Hummingbird image
  # (/usr/bin/node links to it; the real path is what is matched),
  # /usr/local/bin/node in the NemoClaw image.
  - /usr/bin/node
  - /usr/bin/node-*
  - /usr/local/bin/node
